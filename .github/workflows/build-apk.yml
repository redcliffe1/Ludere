name: Build APK
on:
  workflow_dispatch:
    inputs:
      payload_url:
        description: Direct download link to payload.zip
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch payload
        run: |
          curl -L --fail -o payload.zip "${{ github.event.inputs.payload_url }}"
          unzip -o payload.zip -d payload
          ls -la payload
      - name: Install ROM and config
        run: |
          ROM=$(ls payload | grep -v config.xml | head -n1)
          echo "ROM file: $ROM"
          mkdir -p app/src/main/res/raw
          cp "payload/$ROM" app/src/main/res/raw/rom
          cp payload/config.xml app/src/main/res/values/config.xml
          ls -la app/src/main/res/raw
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludere-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
